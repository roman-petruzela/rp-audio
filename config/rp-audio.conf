# rp-audio — runtime settings. Sourced as a bash file, so only shell
# assignments are valid here. Uncomment and adjust what you need; anything
# left commented out keeps its built-in default (shown below).

# % of full scale that `rp-audio volume up|down` moves per step.
#VOLUME_STEP_PCT=2

# Command run after a volume/mute change to trigger an OSD. Left empty,
# no OSD is triggered. Only the first word is checked with `command -v`,
# so this must be a single command (no pipes/redirects).
#OSD_CMD="qs ipc call osd-volume trigger"

# Seconds a freshly added output is quarantined from the daemon's
# "manual change" detection while it settles at its stored volume.
#SETTLE_SECS=4
